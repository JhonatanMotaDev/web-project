<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Biblioteca</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page" data-page="login">
  <main class="auth-wrap">
    <div class="auth-card">
      <header class="auth-header">
        <svg class="brand-icon brand-icon-lg" viewBox="0 0 24 24" width="42" height="42" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
        <h1>Biblioteca</h1>
        <p class="auth-subtitle">Sistema de Gerenciamento de Biblioteca</p>
      </header>

      <div class="auth-tabs">
        <button type="button" id="tab-login" class="auth-tab active">Entrar</button>
        <button type="button" id="tab-register" class="auth-tab">Cadastrar bibliotecário</button>
      </div>

      <form id="form-login" class="auth-panel show" novalidate>
        <div class="form-field">
          <label for="login-email">E-mail</label>
          <input type="email" id="login-email" class="input" placeholder="seu@email.com" autocomplete="email" required>
        </div>
        <div class="form-field">
          <label for="login-senha">Senha</label>
          <input type="password" id="login-senha" class="input" placeholder="••••••••" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Entrar</button>
      </form>

      <form id="form-register" class="auth-panel" novalidate>
        <div class="form-field">
          <label for="reg-nome">Nome completo</label>
          <input type="text" id="reg-nome" class="input" placeholder="Nome do bibliotecário" required>
        </div>
        <div class="form-field">
          <label for="reg-email">E-mail</label>
          <input type="email" id="reg-email" class="input" placeholder="seu@email.com" autocomplete="email" required>
        </div>
        <div class="form-row-2">
          <div class="form-field">
            <label for="reg-senha">Senha</label>
            <input type="password" id="reg-senha" class="input" placeholder="Mínimo 6 caracteres" autocomplete="new-password" required>
          </div>
          <div class="form-field">
            <label for="reg-senha2">Confirmar senha</label>
            <input type="password" id="reg-senha2" class="input" placeholder="Repita a senha" autocomplete="new-password" required>
          </div>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Cadastrar</button>
      </form>
    </div>
  </main>

  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
